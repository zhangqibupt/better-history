<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Better History</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="page-header">
        <p class="page-eyebrow">Browser History</p>
        <div class="page-title-row">
          <h1 class="page-title">Better History</h1>
          <span class="page-badge">Local history</span>
        </div>
        <p class="page-copy">更快搜索标题、URL、域名与最近访问记录</p>
      </header>

      <main class="page-content">
        <form id="search-form" class="search-form">
          <div class="search-command-bar">
            <!-- <span class="search-command-prefix" aria-hidden="true">/</span> -->
            <div class="search-input-wrap">
              <span class="search-icon" aria-hidden="true">
                <svg viewBox="0 0 20 20" fill="none">
                  <circle cx="8.5" cy="8.5" r="4.75"></circle>
                  <path d="M12 12l4 4"></path>
                </svg>
              </span>
              <input
                id="search-input"
                class="search-input"
                type="search"
                placeholder="搜索标题、URL、域名…"
                autocomplete="off"
                spellcheck="false"
              />
            </div>
            <button class="search-button" type="submit">搜索历史</button>
            <button id="settings-button" class="settings-button" type="button" aria-haspopup="dialog" aria-expanded="false">
              设置
            </button>
          </div>
          <div class="search-footer">
            <p class="search-footer-copy">输入后即时过滤，按键盘即可完成整个搜索与打开流程。</p>
            <ul class="search-hints" aria-label="快捷键提示">
              <li>
              <kbd>↑</kbd>
              <kbd>↓</kbd>
              <span>选择</span>
              </li>
              <li>
              <kbd>Enter</kbd>
              <span>直接打开</span>
              </li>
              <li>
              <kbd>Shift</kbd>
              <span>+</span>
              <kbd>Enter</kbd>
              <span>新页面打开</span>
              </li>
              <li>
              <kbd>Ctrl</kbd>
              <span>+</span>
              <kbd>数字</kbd>
              <span>选择筛选项</span>
              </li>
            </ul>
          </div>
        </form>
        <section
          id="settings-dialog"
          class="settings-dialog"
          role="dialog"
          aria-modal="true"
          aria-label="设置"
          hidden
        >
          <div class="settings-surface">
            <div class="settings-header">
              <h2 class="settings-title">设置</h2>
              <button id="settings-close-button" class="settings-close-button" type="button" aria-label="关闭设置">
                ✕
              </button>
            </div>

            <div class="settings-body">
              <section class="settings-section" aria-label="域名优先级">
                <div class="settings-section-header">
                  <div class="settings-section-heading">
                    <h3 class="settings-section-title">域名优先级</h3>
                    <p class="settings-section-copy">命中的域名分组会按你的顺序显示在前，其余分组保持默认排序。</p>
                  </div>
                </div>

                <form id="domain-priority-form" class="settings-form">
                  <label class="settings-field">
                    <span class="settings-label">添加域名</span>
                    <div class="settings-field-row">
                      <input
                        id="domain-priority-input"
                        class="settings-input"
                        type="text"
                        inputmode="url"
                        placeholder="例如 larkoffice.com"
                        autocomplete="off"
                        spellcheck="false"
                      />
                      <button id="domain-priority-add" class="settings-action-button" type="submit">添加</button>
                    </div>
                    <p id="domain-priority-feedback" class="settings-feedback" aria-live="polite"></p>
                  </label>
                </form>

                <div class="settings-list-wrap">
                  <ul id="domain-priority-list" class="settings-list" aria-label="域名优先级列表"></ul>
                </div>
              </section>
            </div>

            <div class="settings-footer">
              <button id="settings-reset-button" class="settings-secondary-button" type="button">恢复默认</button>
              <button id="settings-save-button" class="settings-primary-button" type="button">保存</button>
            </div>
          </div>
        </section>
        <section id="quick-filters-panel" class="quick-filters-panel" hidden></section>


        <section class="results-section" aria-label="浏览历史结果区">
          <div class="results-header">
            <div class="results-heading">
              <h2 id="results-title" class="results-title">最近访问</h2>
              <!-- <p class="results-subtitle">按标题命中、访问频率与最近访问时间排序</p> -->
            </div>
            <span id="results-count-text" class="results-count">0 条</span>
          </div>
          <section id="results-panel" class="results-panel" aria-live="polite"></section>
        </section>
      </main>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
